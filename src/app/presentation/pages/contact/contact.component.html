<section class="min-h-screen bg-black text-white pt-32 pb-20 px-6 font-mono relative overflow-hidden selection:bg-azul-chillon/30">
  
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-rosa-chillon/10 blur-[150px] rounded-full pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-azul-chillon/10 blur-[150px] rounded-full pointer-events-none"></div>

  <div class="max-w-5xl mx-auto space-y-16 relative z-10">
    
    <div class="text-center space-y-4">
      <h2 class="text-6xl md:text-7xl font-black italic uppercase tracking-tighter">
        Conectemos <span class="bg-gradient-to-r from-lila-chillon to-rosa-chillon bg-clip-text text-transparent">Sistemas_</span>
      </h2>
      <p class="text-gray-500 text-[10px] tracking-[0.5em] uppercase opacity-70">Protocolo de comunicación directa disponible</p>
    </div>

    <div class="bg-zinc-900/40 border border-white/5 rounded-[2.5rem] p-8 backdrop-blur-xl group hover:border-azul-chillon/30 transition-all duration-500">
      <p class="text-[9px] uppercase tracking-[0.4em] text-azul-chillon mb-5 ml-2 font-black italic">// CANAL_OFICIAL</p>
      
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <div class="relative flex-1 w-full">
          <input type="text" [value]="myEmail" readonly
                 class="w-full bg-black/50 border border-white/10 rounded-2xl py-5 px-6 text-base md:text-lg font-black text-white outline-none focus:border-azul-chillon/50 transition-all">
          
          <button (click)="copyToClipboard()" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-3 hover:bg-azul-chillon/20 text-azul-chillon rounded-xl transition-all active:scale-90"
                  title="Copiar correo">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
            
            @if (copySuccess()) {
              <span class="absolute -top-12 left-1/2 -translate-x-1/2 text-[9px] bg-azul-chillon text-black font-black px-3 py-1.5 rounded-lg animate-bounce uppercase tracking-tighter">¡Copiado!</span>
            }
          </button>
        </div>

        <button (click)="openGmail()" 
                class="w-full md:w-auto px-10 py-5 bg-white text-black font-black rounded-2xl hover:bg-azul-chillon hover:text-white transition-all flex items-center justify-center gap-3 text-[10px] tracking-[0.2em] uppercase">
          Abrir_Gmail
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (social of socialLinks(); track social.name) {
        <a [href]="social.url" target="_blank"
           class="flex items-center justify-between p-8 rounded-[2.5rem] bg-zinc-900/30 border border-white/5 hover:border-white/20 transition-all group/social hover:-translate-y-2">
          <div class="space-y-1">
            <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">{{ social.name }}</p>
            <p class="text-xl font-black italic uppercase tracking-tighter group-hover/social:text-white">Conectar</p>
          </div>
          <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center grayscale group-hover/social:grayscale-0 group-hover/social:bg-white/10 transition-all">
             <span class="text-2xl">🔗</span>
          </div>
        </a>
      }
    </div>

    <div class="relative group">
       <div class="absolute -inset-1 bg-gradient-to-r from-lila-chillon to-azul-chillon rounded-[3.5rem] blur opacity-10 group-hover:opacity-20 transition-opacity"></div>
       <div class="relative bg-zinc-950 border border-white/5 rounded-[3.5rem] p-8 md:p-12 shadow-2xl">
         <form class="grid grid-cols-1 md:grid-cols-2 gap-10">
           <div class="space-y-6">
             <div class="relative">
               <input type="text" placeholder="IDENTIDAD_USUARIO" class="w-full bg-transparent border-b border-white/10 py-4 focus:border-rosa-chillon outline-none text-[11px] tracking-widest uppercase text-white placeholder:text-gray-700 transition-all">
             </div>
             <div class="relative">
               <input type="email" placeholder="PROTOCOLO_CORREO" class="w-full bg-transparent border-b border-white/10 py-4 focus:border-lila-chillon outline-none text-[11px] tracking-widest uppercase text-white placeholder:text-gray-700 transition-all">
             </div>
           </div>
           <div>
             <textarea placeholder="MENSAJE_DE_SISTEMA" rows="4" class="w-full bg-transparent border-b border-white/10 py-4 focus:border-azul-chillon outline-none text-[11px] tracking-widest uppercase text-white placeholder:text-gray-700 resize-none transition-all"></textarea>
           </div>
           <button class="md:col-span-2 w-full py-6 bg-gradient-to-r from-lila-chillon to-rosa-chillon text-white font-black text-[11px] tracking-[0.5em] uppercase hover:scale-[1.01] hover:shadow-[0_20px_40px_-10px_rgba(190,24,93,0.4)] transition-all rounded-2xl active:scale-95">
             Enviar_Protocolo.exe
           </button>
         </form>
       </div>
    </div>

  </div>
</section>
