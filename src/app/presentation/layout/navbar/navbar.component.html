<nav class="fixed top-0 left-0 w-full z-[150] px-6 py-6 transition-all duration-500">
  <div class="max-w-7xl mx-auto flex justify-between items-center bg-white/[0.02] backdrop-blur-2xl border border-white/10 rounded-[2rem] px-8 py-4 shadow-glass-azul">
    
    <div class="flex items-center gap-3 group cursor-pointer" routerLink="/">
      <div class="w-9 h-9 bg-gradient-to-br from-rosa-chillon to-lila-chillon rounded-xl rotate-45 group-hover:rotate-[225deg] transition-all duration-700 flex items-center justify-center shadow-[0_0_15px_rgba(255,0,127,0.5)]">
        <span class="text-black font-black -rotate-45 group-hover:rotate-[-225deg] transition-transform text-sm">E</span>
      </div>
      <span class="font-mono font-black tracking-tighter text-xl text-white">
        ELIA.<span class="bg-gradient-to-r from-lila-chillon to-azul-chillon bg-clip-text text-transparent">CH</span>
      </span>
    </div>

    <div class="hidden md:flex items-center gap-12">
      @for (link of navLinks; track link.name) {
        <a [routerLink]="link.path" 
           routerLinkActive="active-link"
           class="clickable text-[10px] font-black uppercase tracking-[0.4em] text-white/50 hover:text-rosa-chillon transition-all relative group py-2">
          {{ link.name }}
          <span class="absolute -bottom-1 left-0 w-0 h-[2px] bg-gradient-to-r from-rosa-chillon to-azul-chillon transition-all duration-500 group-hover:w-full"></span>
        </a>
      }
    </div>

    <div class="hidden md:block">
      <div class="px-5 py-2 bg-black/40 border border-azul-chillon/20 rounded-2xl flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-azul-chillon animate-pulse shadow-[0_0_10px_#00d4ff]"></div>
        <span class="text-[9px] font-black text-azul-chillon uppercase tracking-[0.2em] italic">System_Online</span>
      </div>
    </div>

    <button (click)="toggleMenu()" class="md:hidden text-rosa-chillon text-2xl clickable p-2">
      <span class="font-mono">{{ isMenuOpen() ? '×' : '☰' }}</span>
    </button>
  </div>

  @if (isMenuOpen()) {
    <div class="md:hidden absolute top-28 left-6 right-6 bg-black/80 backdrop-blur-3xl border border-white/10 rounded-[2.5rem] p-12 shadow-glass-rosa animate-reveal-up overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-azul-chillon/10 blur-3xl rounded-full"></div>
      
      <div class="flex flex-col gap-10 items-center relative z-10">
        @for (link of navLinks; track link.name) {
          <a [routerLink]="link.path" 
             (click)="toggleMenu()" 
             class="text-3xl font-black italic uppercase tracking-tighter text-white/40 hover:text-rosa-chillon transition-colors">
            {{ link.name }}
          </a>
        }
      </div>
    </div>
  }
</nav>
