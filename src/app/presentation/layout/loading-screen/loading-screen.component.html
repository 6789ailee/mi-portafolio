<div class="fixed inset-0 z-[300] bg-black flex flex-col items-center justify-center overflow-hidden font-mono">
  
  <div class="absolute top-1/4 -left-20 w-80 h-80 bg-rosa-chillon/10 blur-[120px] rounded-full animate-pulse-soft"></div>
  <div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-azul-chillon/10 blur-[120px] rounded-full animate-pulse-soft"></div>

  <div class="relative z-10 p-10 md:p-14 bg-white/[0.03] backdrop-blur-2xl border border-white/10 rounded-[3rem] shadow-glass-rosa flex flex-col items-center max-w-lg w-[90%] animate-reveal-up">
    
    <div class="mb-10 flex items-center">
      <span class="text-xl md:text-3xl tracking-tighter uppercase italic font-black bg-gradient-to-r from-rosa-chillon via-lila-chillon to-azul-chillon bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(255,0,127,0.4)]">
        {{ text() }}
      </span>
      <span class="w-2 h-8 bg-lila-chillon ml-3 animate-blink-fast shadow-[0_0_15px_#a855f7]"></span>
    </div>

    <div class="relative w-full group">
      <div class="flex justify-between mb-3 px-1">
        <span class="text-[10px] text-rosa-chillon font-black uppercase tracking-[0.3em] italic">Initializing_Core</span>
        <span class="text-[10px] text-azul-chillon font-black">{{ progress() }}%</span>
      </div>

      <div class="h-[3px] w-full bg-white/5 rounded-full overflow-hidden relative border border-white/10">
        <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-rosa-chillon via-lila-chillon to-azul-chillon animate-gradient-x transition-all duration-300"
             [style.width.%]="progress()">
        </div>
      </div>
      
      <div class="absolute -bottom-6 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-lila-chillon/40 to-transparent blur-md"></div>
    </div>

    <div class="mt-12 flex flex-col items-center gap-4">
      <span class="text-[9px] text-white/20 tracking-[0.8em] uppercase italic">
        Neural_Link_Established
      </span>
      <div class="w-24 h-[1px] bg-azul-chillon/30 overflow-hidden relative">
        <div class="absolute inset-0 bg-azul-chillon animate-scan shadow-[0_0_10px_#00d4ff]"></div>
      </div>
    </div>
  </div>
</div>
