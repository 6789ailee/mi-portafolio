<section class="py-24 bg-black relative overflow-hidden">
  <div class="mb-16 text-center animate-reveal-up">
    <h2 class="text-4xl md:text-5xl font-black text-white italic uppercase tracking-tighter">
      MI <span class="bg-gradient-to-r from-rosa-chillon via-lila-chillon to-azul-chillon bg-clip-text text-transparent">TECH_STREAM</span>
    </h2>
  </div>

  <div class="relative flex overflow-hidden group/track">
    <div class="flex animate-infinite-scroll group-hover/track:[animation-play-state:paused] gap-6 px-3">
      
      @for (skill of skills; track skill.name) {
        <ng-container *ngTemplateOutlet="skillCard; context: { $implicit: skill }"></ng-container>
      }
      @for (skill of skills; track skill.name + 'copy') {
        <ng-container *ngTemplateOutlet="skillCard; context: { $implicit: skill }"></ng-container>
      }
    </div>
  </div>

  <ng-template #skillCard let-skill>
    <div class="clickable group relative min-w-[180px] p-8 rounded-[2rem] bg-white/[0.02] border border-white/10 backdrop-blur-xl flex flex-col items-center justify-center transition-all duration-500 hover:border-white/30">
      
      <div class="absolute inset-0 rounded-[2rem] opacity-0 group-hover:opacity-20 blur-2xl transition-opacity duration-500"
           [style.backgroundColor]="skill.color"></div>

      <div class="relative z-10 mb-4 w-12 h-12 flex items-center justify-center">
        <img [src]="skill.icon" 
             [alt]="skill.name" 
             class="w-full h-full object-contain brightness-0 invert opacity-50 group-hover:opacity-100 group-hover:brightness-100 group-hover:invert-0 transition-all duration-500">
      </div>

      <span class="relative z-10 text-white/40 font-black group-hover:text-white transition-colors uppercase tracking-[0.2em] text-[10px] italic">
        {{ skill.name }}
      </span>
    </div>
  </ng-template>
</section>
